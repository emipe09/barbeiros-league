<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barbeiros League</title>
<meta name="description" content="Classificação, resultados e histórico da Barbeiros League, campeonato de F1 virtual." />
<meta name="theme-color" content="#c8102e" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="assets/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css" />
<script src="config.js"></script>

<body>

    <label class="season-pick">

      <select id="season" hidden></select>

  <nav class="nav" aria-label="Seções">
    <a href="#/" data-nav="home">Classificação</a>
    <a href="#/corridas" data-nav="races">Corridas</a>
    <a href="#/hall" data-nav="hall">Hall da fama</a>
    <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
  </nav>

<main id="main" tabindex="-1">
  <div class="loading" aria-live="polite">Carregando a liga…</div>
</main>

<footer class="foot">
  <p id="updated"></p>
  <p>Barbeiros League: F1 virtual entre amigos.</p>
</footer>

<script type="module" src="js/main.js"></script>
